<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slider">
    <div class="slides">
      <div class="slide"><img src="https://picsum.photos/id/1018/800/400" alt="1"></div>
      <div class="slide"><img src="https://picsum.photos/id/1015/800/400" alt="2"></div>
      <div class="slide"><img src="https://picsum.photos/id/1019/800/400" alt="3"></div>
    </div>

    <!-- Navigation Buttons -->
    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

    <!-- Dots -->
    <div class="dots"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
